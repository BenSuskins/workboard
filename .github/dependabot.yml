version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-actions)"
    labels:
      - "dependencies"
    groups:
      actions-minor:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-workboard)"
    labels:
      - "dependencies"
    groups:
      workboard-minor:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-workboard-container)"
    labels:
      - "dependencies"
    groups:
      workboard-container-minor:
        update-types:
          - "minor"
          - "patch"
