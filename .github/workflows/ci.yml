name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Typecheck
        run: |
          bun run --filter @workboard/core build
          bun run --filter @workboard/mcp build
      - name: MCP smoke (full agent flow over stdio)
        run: bun run mcp:smoke
      - name: Next.js production build
        run: bun run --filter @workboard/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image
        run: docker build -t workboard:ci .
      - name: Boot check — MCP server
        run: |
          docker run -d --name mcp -p 8787:8787 workboard:ci bun run packages/mcp/src/http.ts
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz && ok=1 && break || sleep 1
          done
          [ "$ok" = "1" ] || { echo "MCP healthz never came up"; docker logs mcp; exit 1; }
          docker rm -f mcp
      - name: Boot check — web app
        run: |
          docker run -d --name web -p 3000:3000 workboard:ci
          for i in $(seq 1 45); do
            curl -sf http://localhost:3000 >/dev/null && ok=1 && break || sleep 1
          done
          [ "$ok" = "1" ] || { echo "web / never came up"; docker logs web; exit 1; }
          curl -s http://localhost:3000 | grep -q "Workboard" || { echo "unexpected homepage"; exit 1; }
          docker rm -f web
      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          IMAGE_LOWER=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          TAGS="sha-${GITHUB_SHA::12}"
          [ "$GITHUB_REF" = "refs/heads/main" ] && TAGS="$TAGS latest"
          case "$GITHUB_REF" in refs/tags/*) TAGS="$TAGS ${GITHUB_REF#refs/tags/}";; esac
          for tag in $TAGS; do
            docker tag workboard:ci "$IMAGE_LOWER:$tag"
            docker push "$IMAGE_LOWER:$tag"
          done
